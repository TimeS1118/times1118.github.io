<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给最爱的AWA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #ffecd2, #fcb69f); /* 温柔的渐变背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
            text-align: center;
            overflow: hidden; /* 防止心形溢出 */
            position: relative;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9); /* 半透明白色背景，突出内容 */
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); /* 柔和的阴影 */
            max-width: 800px;
            position: relative;
            z-index: 10; /* 确保内容在心形之上 */
        }

        h1 {
            color: #e94e77; /* 浪漫的粉红色 */
            font-size: 3.5em;
            margin-bottom: 20px;
            position: relative;
            animation: fadeInScale 2s ease-out; /* 渐入放大动画 */
        }

        p {
            font-size: 1.5em;
            line-height: 1.8;
            color: #555;
            margin-bottom: 30px;
            animation: fadeInUp 2.5s ease-out; /* 渐入上浮动画 */
        }

        .signature {
            font-style: italic;
            font-size: 1.2em;
            color: #777;
            margin-top: 40px;
            animation: fadeIn 3s ease-out; /* 渐入动画 */
        }

        /* 浪漫的心形浮动特效 */
        .heart {
            position: absolute;
            background-color: #ffb6c1; /* 浅粉色心形 */
            width: 20px;
            height: 20px;
            transform: rotate(-45deg);
            animation: floatHeart 10s infinite ease-in-out;
            opacity: 0;
            z-index: 5;
        }
        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #ffb6c1;
        }
        .heart::before {
            top: -10px;
            left: 0;
        }
        .heart::after {
            left: 10px;
            top: 0;
        }

        /* 动画 */
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes floatHeart {
            0% { transform: translateY(0) scale(0) rotate(-45deg); opacity: 0; }
            20% { opacity: 0.8; transform: translateY(-50px) scale(1) rotate(-45deg); }
            80% { opacity: 0.8; transform: translateY(-400px) scale(1.2) rotate(-45deg); }
            100% { opacity: 0; transform: translateY(-500px) scale(1.5) rotate(-45deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>给我的最爱，AWA</h1>
        <p>
            亲爱的AWA，<br>
            每一天有你，都像是活在最美的梦里。<br>
            你的笑容，是世间最温暖的光；你的存在，是我生命里最动听的旋律。<br>
            遇见你，是我此生最大的幸运。<br>
            我爱你，不是因为你是谁，而是因为和你在一起时，我变成了最好的自己。<br>
            愿我们的爱，如同星辰般璀璨，永恒不灭。<br>
            很爱你，很爱你，非常爱你。
        </p>
        <p class="signature">— 永远爱你的TA</p>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            document.body.appendChild(heart);

            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 6 + 4 + 's'; // 4-10秒
            heart.style.animationDelay = Math.random() * 5 + 's'; // 0-5秒延迟
            heart.style.opacity = Math.random() * 0.5 + 0.3; // 0.3-0.8透明度

            setTimeout(() => {
                heart.remove();
            }, 10000); // 10秒后移除，与动画时长匹配
        }

        setInterval(createHeart, 500); // 每0.5秒创建一个心形
    </script>
</body>
</html>
